[package]
name = "helper"
version = "0.1.0"
authors = ["LimLife"]
edition = "2021"


[dependencies]
anyhow = "1.0.99"
dioxus = { version = "0.7.3", features = ["router"] }
tokio = { version = "1.49.0",optional = true, features = ["macros", "rt-multi-thread"] }
sqlx = { version = "0.8", optional = true, features = ["runtime-tokio","postgres","macros"]}
#My lib
shared = {path = "./shared"}
uuid = {version = "1.23.2", features = ["v4", "serde", "js"]}


[features]
default = ["web"]
web = ["dioxus/web"]
server = ["dioxus/server", "tokio", "sqlx", "dioxus/fullstack"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
